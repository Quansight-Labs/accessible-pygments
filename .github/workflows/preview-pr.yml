name: Deploy PR previews on GH pages

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

concurrency: preview-${{ github.ref }}

permissions: {}

env:
    FORCE_COLOR: "1"
    PYTHONIOENCODING: utf-8
    SETUPTOOLS_SCM_PRETEND_VERSION: "1.0" # avoid warnings about shallow checkout

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push previews to the gh-pages branch
      pull-requests: write # post the preview link comment on PRs
    steps:
    - name: Checkout repository 🛎
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.10'

    - name: Install dependencies 📦
      run: |
        pip install pygments>=1.5
        pip install -e .[dev]

    - name: Build the demo pages 📚
      run: |
        python test/run_css.py --save-dir docs

    - name: Deploy PR Preview
      # fork and Dependabot PRs get a read-only token, so the push would fail
      if: >-
        github.event_name == 'push' ||
        (github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]')
      uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
      with:
        source-dir: docs
        preview-branch: gh-pages

  publish-pages:
    runs-on: ubuntu-latest
    needs: deploy-preview
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pages: write
      id-token: write

    concurrency:
      group: "pages"
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout repository 🛎
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.10'

    - name: Install dependencies 📦
      run: |
        pip install pygments>=1.5
        pip install -e .[dev]

    - name: Build the demo pages 📚
      run: |
        python test/render_html.py

    - name: Setup Pages 🛠
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

    - name: Upload artifact 📥
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: "docs"
    - name: Deploy to GitHub Pages 🚀
      id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
